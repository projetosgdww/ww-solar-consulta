name: WW Solar - Area Cliente DEV - Validacao
on:
  pull_request:
    branches:
      - main
    paths:
      - "cliente-*"
      - "admin-dev.*"
      - "supabase/**"
      - "tests/**"
      - "scripts/build-cliente-dev.mjs"
      - "kits-admin-dev.*"
      - "kit-builder-core.js"
      - ".github/workflows/wwsolar-cliente-dev-check.yml"
  push:
    branches:
      - feat/wwsolar-area-cliente-dev
      - release/wwsolar-pecas-v1
    paths:
      - "cliente-*"
      - "admin-dev.*"
      - "supabase/wwsolar-quote-requests-dev.sql"
      - "supabase/wwsolar-quote-audit-dev.sql"
      - "supabase/functions/wwsolar-quote/**"
      - "tests/cliente-*"
      - "tests/wwsolar-quote-rls-dev.sql"
      - "scripts/build-cliente-dev.mjs"
      - "kits-admin-dev.*"
      - "kit-builder-core.js"
      - "tests/kit-builder.test.cjs"
      - "supabase/wwsolar-kit-drafts-dev.sql"
      - "supabase/wwsolar-dev-schema.sql"
      - "supabase/functions/wwsolar-create-customer/**"
      - ".github/workflows/wwsolar-cliente-dev-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Sintaxe JavaScript
        run: |
          node --check cliente-core.js
          node --check cliente-dev.js
          node --check admin-dev.js
          node --check kit-builder-core.js
          node --check kits-admin-dev.js
      - name: Testes do carrinho e do simulador
        run: node --test tests/cliente-core.test.cjs
      - name: Testes dos 12 kits e calculo seguro de custos
        run: node --test tests/kit-builder.test.cjs
      - name: Guardas de seguranca estatica
        run: node tests/cliente-security.test.cjs
      - name: Construir arquivos permitidos da area DEV
        run: node scripts/build-cliente-dev.mjs
      - name: Confirmar que nao publica tabela de precos publicos
        run: node --test tests/cliente-build.test.cjs
